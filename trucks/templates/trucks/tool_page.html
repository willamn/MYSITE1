{% extends 'trucks/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-12 text-center mb-5">
            <h2>开发工具下载中心</h2>
            <p class="text-secondary">下载项目源码、SDK工具、环境配置包</p>
        </div>

        {% for item in tool_data %}
        <div class="col-12 mb-4">
            <div class="border rounded p-4 shadow-sm">
                <h4>{{ item.tool_name }} <span class="badge bg-success">{{ item.version }}</span></h4>
                <p class="text-muted">{{ item.tool_desc }}</p>
                <span>发布时间：{{ item.release_time|date:"Y-m-d" }}</span>
                <div class="mt-3">
                    <a href="{{ item.tool_zip.url }}" class="btn btn-success">立即下载压缩包</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <p class="text-secondary">暂无可用开发工具包</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
