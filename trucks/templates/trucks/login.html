<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        .box{width: 400px;margin: 50px auto;padding: 20px;border:1px solid #ccc;}
        .flex{display: flex;justify-content: space-between;margin-top:10px;}
    </style>
</head>
<body>
<div class="box">
    <h2 align="center">登录</h2>
    <form method="post">
        {% csrf_token %}
        <!-- 登录分类 -->
        <div align="center" style="margin:10px 0">
            <label><input type="radio" name="login_type" value="user" checked> 用户登录</label>
            &nbsp;&nbsp;&nbsp;
            <label><input type="radio" name="login_type" value="admin"> 管理员登录</label>
        </div>

        <!-- 关键：这里name必须是phone，和视图对应 -->
        <input type="text" name="phone" placeholder="请输入用户名/手机号" required style="width:100%;height:35px;margin:5px 0">
        <input type="password" name="password" placeholder="密码" required style="width:100%;height:35px;margin:5px 0">
        
        <div class="flex">
            <a href="{% url 'find_pwd' %}">找回密码</a>
            <a href="{% url 'register' %}">注册用户</a>
        </div>

        <button type="submit" style="width:100%;height:40px;background:#007bff;color:white;border:none;margin-top:15px">登录</button>
    </form>
    {% if error %}
        <p style="color:red;text-align:center">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
