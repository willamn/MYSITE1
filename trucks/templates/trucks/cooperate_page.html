{% extends 'base.html' %}
{% block content %}

<div class="banner" style="width: 100%; height: 500px; background: url('/static/trucks/images/developer/1/banner1.jpg') no-repeat center center; background-size: cover; position: relative; margin-bottom: 40px;">
    <div class="banner-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
        <h1 style="font-size: 2.8rem; font-weight: 600; margin-bottom: 10px;">合作开发计划</h1>
        <p style="font-size: 1.2rem; opacity: 0.95;">携手共赢 · 共建智能无人运输生态</p>
    </div>
</div>

<style>
.cooperate-card {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 20px;
    background: #fff;
}
.btn-detail {
    padding: 6px 20px;
    background: #16478a;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.detail-content {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed #eee;
    display: none;
}
</style>

<div class="container py-2">
    <div class="row">
        <div class="col-12">
            {% for plan in cooperate_list %}
            <div class="cooperate-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h4>{{ plan.plan_title }}</h4>
                    <button class="btn-detail" onclick="toggleDetail({{ forloop.counter }})">
                        了解详情
                    </button>
                </div>
                <div class="detail-content" id="detail-{{ forloop.counter }}">
                    {{ plan.plan_content|safe }}
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-secondary">暂无合作开发相关内容</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- 原生JS展开收起，绝对可用 -->
<script>
function toggleDetail(id) {
    const content = document.getElementById('detail-' + id);
    const btn = event.currentTarget;
    
    if (content.style.display === 'none' || content.style.display === '') {
        content.style.display = 'block';
        btn.textContent = '收起详情';
    } else {
        content.style.display = 'none';
        btn.textContent = '了解详情';
    }
}
</script>
{% endblock %}
