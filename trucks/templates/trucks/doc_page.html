{% extends 'base.html' %}
{% block content %}
<!-- 顶部统一Banner -->
<div class="banner" style="width: 100%; height: 500px; background: url('/static/trucks/images/developer/1/banner2.jpg') no-repeat center center; background-size: cover; position: relative; margin-bottom: 40px;">
    <div class="banner-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;">
        <h1 style="font-size: 2.8rem; font-weight: 600; margin-bottom: 10px;">开发者文档中心</h1>
        <p style="font-size: 1.2rem; opacity: 0.95;">规范文档 | 开发指南 | 使用说明</p>
    </div>
</div>

<!-- 美化版文档列表 -->
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            {% for doc in doc_data %}
            <div class="card mb-4 shadow-sm border-0 rounded-3 overflow-hidden">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-primary mb-2">{{ doc.title }}</h4>
                    {% if doc.introduce %}
                    <p class="text-muted small mb-2">{{ doc.introduce }}</p>
                    {% endif %}
                    <p class="text-muted small mb-3">
                        <i class="bi bi-clock-history me-1"></i> 上传时间：{{ doc.add_time|date:"Y年m月d日" }}
                    </p>
                    <div class="d-flex gap-2 mt-2">
                        <a href="{% url 'document_action' doc.id 'view' %}" class="btn btn-outline-primary px-4">
                            <i class="bi bi-eye me-1"></i> 在线查看
                        </a>
                        <a href="{% url 'document_action' doc.id 'download' %}" class="btn btn-primary px-4">
                            <i class="bi bi-download me-1"></i> 下载文档
                        </a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="text-center py-5">
                <i class="bi bi-file-earmark-text text-muted fs-1"></i>
                <p class="text-muted mt-3">暂无开发者文档</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
