<style>
/* 全局基础样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", Arial, sans-serif;
}

/* ==========================================
   Banner 轮播图（全屏宽度 + 可调整高度）
========================================== */
.banner-carousel {
    width: 100%;
    height: 550px; /* ✅ 这里调高度，改数值就行 */
    position: relative;
    overflow: hidden;
}
.banner-slides {
    display: flex;
    width: 300%;
    height: 100%;
    animation: slide 15s infinite ease-in-out;
}
.banner-slides img {
    width: 33.333%;
    height: 100%;
    object-fit: cover;
    flex-shrink: 0;
    filter: brightness(0.8);
}
@keyframes slide {
    0%, 28%  { transform: translateX(0); }
    33%, 61% { transform: translateX(-33.333%); }
    66%, 94% { transform: translateX(-66.666%); }
    100%     { transform: translateX(0); }
}
.hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    z-index: 2;
    width: 100%;
    padding: 0 20px;
}
.hero-text h1 {
    font-size: 52px;
    margin-bottom: 18px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.4);
}
.hero-text p {
    font-size: 22px;
    margin-bottom: 30px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
}
.hero-btn {
    padding: 16px 36px;
    background: #0066cc;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    transition: background 0.3s ease;
}
.hero-btn:hover {
    background: #0052a3;
}

/* ==========================================
   通用布局
========================================== */
.container {
    max-width: 1200px;
    margin: 80px auto;
    padding: 0 20px;
}
.page-title {
    font-size: 38px;
    text-align: center;
    color: #222;
    font-weight: bold;
    margin-bottom: 20px;
}
.page-subtitle {
    text-align: center;
    color: #666;
    font-size: 18px;
    margin-bottom: 50px;
    line-height: 1.6;
}

/* ==========================================
   核心优势：左图右文（你要的样式！带图）
========================================== */
.advantage-item {
    display: flex;
    align-items: center;
    gap: 50px;
    margin-bottom: 60px;
}
.advantage-item:nth-child(even) {
    flex-direction: row-reverse;
}
.advantage-img {
    width: 50%;
    height: 280px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.advantage-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}
.advantage-img img:hover {
    transform: scale(1.05);
}
.advantage-text {
    width: 50%;
}
.advantage-text h3 {
    font-size: 28px;
    color: #0066cc;
    margin-bottom: 20px;
    font-weight: bold;
}
.advantage-text p {
    font-size: 18px;
    line-height: 1.9;
    color: #444;
}

/* ==========================================
   核心技术专栏：带图+错落+通栏（恢复图片）
========================================== */
.tech-section {
    width: 100%;
    background: #f8fafc;
    padding: 90px 0;
    margin: 70px 0;
}
.tech-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}
.tech-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
}
.tech-item {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
}
.tech-item:nth-child(2) {
    transform: translateY(15px);
}
.tech-item:hover {
    transform: translateY(-7px) !important;
}
.tech-item img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}
.tech-info {
    padding: 30px;
}
.tech-info h3 {
    font-size: 24px;
    color: #0066cc;
    margin-bottom: 15px;
    font-weight: bold;
}
.tech-info p {
    font-size: 17px;
    line-height: 1.8;
    color: #555;
    margin-bottom: 8px;
}
.tech-footer {
    margin-top: 60px;
    text-align: center;
}
.tech-footer h3 {
    font-size: 26px;
    color: #0066cc;
    margin-bottom: 15px;
}
.tech-footer p {
    font-size: 18px;
    line-height: 1.9;
    color: #555;
    max-width: 1000px;
    margin: 0 auto;
}

/* ==========================================
   发展历程：带图+时间轴风格（恢复图片）
========================================== */
.history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}
.history-item {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    border-left: 5px solid #0066cc;
    transition: all 0.3s ease;
}
.history-item:hover {
    transform: translateY(-5px);
}
.history-item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.history-info {
    padding: 25px;
}
.history-info h3 {
    font-size: 22px;
    color: #0066cc;
    margin-bottom: 10px;
    font-weight: bold;
}
.history-info p {
    font-size: 16px;
    line-height: 1.7;
    color: #555;
}

/* ==========================================
   发展前景：高级美观+保留过渡
========================================== */
.prospect {
    width: 100%;
    background: linear-gradient(135deg, #f7fbff 0%, #e8f4ff 100%);
    padding: 90px 0;
    margin: 70px 0;
}
.prospect-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}
.prospect-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 30px;
}
.prospect-item {
    background: #fff;
    border-radius: 16px;
    padding: 35px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
}
.prospect-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 28px rgba(0,102,204,0.1);
}
.prospect-item h3 {
    font-size: 26px;
    color: #0066cc;
    margin-bottom: 18px;
    font-weight: bold;
}
.prospect-item p {
    font-size: 18px;
    line-height: 2;
    color: #444;
    text-indent: 2em;
}
/* ==========================================
   方案与应用页样式
========================================== */
.page-banner {
    width: 100%;
    height: 400px;
    position: relative;
    overflow: hidden;
}
.page-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.75);
}
.banner-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    z-index: 2;
}
.banner-text h1 {
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 15px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.4);
}
.banner-text p {
    font-size: 20px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
}

/* 场景项：左图右文/交替排版 */
.scenario-item {
    display: flex;
    align-items: center;
    gap: 60px;
    margin-bottom: 80px;
}
.scenario-item.reverse {
    flex-direction: row-reverse;
}
.scenario-img {
    width: 50%;
    height: 320px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.scenario-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}
.scenario-img img:hover {
    transform: scale(1.05);
}
.scenario-text {
    width: 50%;
}
.scenario-text h3 {
    font-size: 30px;
    color: #0066cc;
    margin-bottom: 20px;
    font-weight: bold;
}
.scenario-text h4 {
    font-size: 20px;
    color: #222;
    margin: 15px 0 10px;
    font-weight: bold;
}
.scenario-text p {
    font-size: 17px;
    line-height: 1.8;
    color: #555;
    margin-bottom: 10px;
}
.scenario-text ul {
    margin: 10px 0 15px 25px;
}
.scenario-text ul li {
    font-size: 17px;
    line-height: 1.8;
    color: #555;
    margin-bottom: 8px;
}

/* 方案优势网格 */
.advantage-section {
    margin-top: 80px;
    padding-top: 60px;
    border-top: 1px solid #eee;
}
.advantage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
}
.advantage-card {
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    transition: all 0.3s ease;
}
.advantage-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 12px 28px rgba(0,102,204,0.12);
}
.advantage-card h3 {
    font-size: 24px;
    color: #0066cc;
    margin-bottom: 15px;
    font-weight: bold;
}
.advantage-card p {
    font-size: 17px;
    line-height: 1.8;
    color: #555;
}
</style>
