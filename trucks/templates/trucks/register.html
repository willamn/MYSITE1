<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>.box{width: 400px;margin: 50px auto;padding: 20px;border:1px solid #ccc;}</style>
</head>
<body>
<div class="box">
    <h2 align="center">注册</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="phone" placeholder="手机号" required style="width:100%;height:35px;margin:5px 0">
        <input type="text" name="username" placeholder="用户名" required style="width:100%;height:35px;margin:5px 0">
        <input type="password" name="pwd1" placeholder="设置密码" required style="width:100%;height:35px;margin:5px 0">
        <input type="password" name="pwd2" placeholder="确认密码" required style="width:100%;height:35px;margin:5px 0">
        <button type="submit" style="width:100%;height:40px;background:#007bff;color:white;border:none;margin-top:15px">注册</button>
    </form>
    {% if error %}
        <p style="color:red;text-align:center">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
