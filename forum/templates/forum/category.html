{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>{{ cate.name }}</h2>
    <p class="text-muted">{{ cate.description }}</p>
    <hr>

    {% if user.is_authenticated %}
        <a href="{% url 'forum:create_post' cate.id %}" class="btn btn-primary mb-3">发布新帖子</a>
    {% endif %}

    {% for post in posts %}
        <div class="card mb-3 p-3">
            <h5>
                <a href="{% url 'forum:post_detail' post.id %}">{{ post.title }}</a>
            </h5>
            <small>发布人：{{ post.author.username }} | {{ post.created_at }}</small>
        </div>
    {% empty %}
        <p>本板块还没有帖子，快来发布第一条吧！</p>
    {% endfor %}
</div>
{% endblock %}
